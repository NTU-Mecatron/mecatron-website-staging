title: "Mecatron visual system"
intro: "A survey-console palette for a marine robotics team: deep ocean ink, sea-foam type, and signal-orange markers."
colors:
  - name: "Deep ink"
    token: "--ink"
    hex: "#07151B"
    usage: "Main background"
    className: "swatch-ink"
    textClass: "swatch-light"
  - name: "Soft ink"
    token: "--ink-soft"
    hex: "#10272E"
    usage: "Panels and cards"
    className: "swatch-ink-soft"
    textClass: "swatch-light"
  - name: "Paper"
    token: "--paper"
    hex: "#E8EEE8"
    usage: "Primary text and light surfaces"
    className: "swatch-paper"
    textClass: "swatch-dark"
  - name: "Dim paper"
    token: "--paper-dim"
    hex: "#AABBB4"
    usage: "Secondary text and metadata"
    className: "swatch-paper-dim"
    textClass: "swatch-dark"
  - name: "Signal orange"
    token: "--signal"
    hex: "#FF6B3D"
    usage: "Primary actions and highlights"
    className: "swatch-signal"
    textClass: "swatch-dark"
  - name: "Soft signal"
    token: "--signal-soft"
    hex: "#FF9671"
    usage: "Hover states and secondary accents"
    className: "swatch-signal-soft"
    textClass: "swatch-dark"
  - name: "Sea foam"
    token: "--foam"
    hex: "#C5EFE5"
    usage: "Technical highlights and diagrams"
    className: "swatch-foam"
    textClass: "swatch-dark"
type:
  - name: "IBM Plex Sans"
    role: "Display and body"
    sample: "Build for the water."
  - name: "DM Mono"
    role: "Metadata and technical labels"
    sample: "SYSTEM / READY / 2026"
